version: '3.9'

services:
  app:
    image: sessions-svc-s13
    container_name: sessions-svc-s13
    ports:
      - "8227:8227"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8227/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-net

  db:
    image: redis:7-alpine
    container_name: sessions-db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  gateway:
    image: nginx:alpine
    container_name: sessions-gateway
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge