apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.app }}
  labels:
    app: {{ .Values.gateway.app }}
    project: {{ .Values.projectCode }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.gateway.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.gateway.app }}
        project: {{ .Values.projectCode }}
    spec:
      containers:
        - name: {{ .Values.gateway.container }}
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Values.projectCode }}-config
          resources:
{{ toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.service.name }}
  labels:
    app: {{ .Values.gateway.app }}
    project: {{ .Values.projectCode }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.gateway.app }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
