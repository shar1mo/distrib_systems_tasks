apiVersion: v1
kind: ConfigMap
metadata:
  name: shipments-s13-config
data:
  PROJECT_CODE: shipments-s13
  GATEWAY_PREFIX: /api
  SHIPMENTS_GRPC_TARGET: shipments-svc-s13:8131
  AUDIT_URL: http://audit-service:8132
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shipments-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-app
  labels:
    app: gateway-app
    project: shipments-s13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-app
  template:
    metadata:
      labels:
        app: gateway-app
        project: shipments-s13
    spec:
      containers:
        - name: gateway-container
          image: shipments-s13-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shipments-s13-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipments-app
  labels:
    app: shipments-app
    project: shipments-s13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipments-app
  template:
    metadata:
      labels:
        app: shipments-app
        project: shipments-s13
    spec:
      containers:
        - name: shipments-container
          image: shipments-s13:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8130
              name: http
            - containerPort: 8131
              name: grpc
          env:
            - name: SERVICE_NAME
              value: shipments-svc-s13
            - name: APP_PORT
              value: "8130"
            - name: GRPC_PORT
              value: "8131"
            - name: DATABASE_PATH
              value: /data/shipments.db
          envFrom:
            - configMapRef:
                name: shipments-s13-config
          volumeMounts:
            - name: shipments-data
              mountPath: /data
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8130
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8130
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: shipments-data
          persistentVolumeClaim:
            claimName: shipments-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-app
  labels:
    app: audit-app
    project: shipments-s13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-app
  template:
    metadata:
      labels:
        app: audit-app
        project: shipments-s13
    spec:
      containers:
        - name: audit-container
          image: shipments-s13-audit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8132
          env:
            - name: SERVICE_NAME
              value: audit-service
            - name: DATABASE_PATH
              value: /data/audit.db
          envFrom:
            - configMapRef:
                name: shipments-s13-config
          volumeMounts:
            - name: audit-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8132
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8132
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: audit-data
          persistentVolumeClaim:
            claimName: audit-data
