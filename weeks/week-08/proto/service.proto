syntax = "proto3";

package products.v1;

message CreateProductRequest {
  string name = 1;
  float price = 2;
}

message CreateProductResponse {
  string id = 1;
  string name = 2;
  float price = 3;
}

// Новый запрос для стриминга
message ListProductsRequest {
  int32 limit = 1; // Максимальное количество продуктов в потоке
}

// Ответ для стриминга
message Product {
  string id = 1;
  string name = 2;
  float price = 3;
}

service ProductsService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);

  // Server Streaming RPC
  rpc ListProductsStream(ListProductsRequest) returns (stream Product);
}