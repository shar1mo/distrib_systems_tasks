version: "3.8"

services:
  items-svc-s13:
    build: .
    container_name: items-svc-s13
    command: uvicorn main:app --host 0.0.0.0 --port 8101
    ports:
      - "8101:8101"

  other-svc:
    build: .
    container_name: other-svc
    command: uvicorn other:app --host 0.0.0.0 --port 8102
    ports:
      - "8102:8102"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - items-svc-s13
      - other-svc